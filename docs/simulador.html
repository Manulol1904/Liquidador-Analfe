}

.resumen-ficha > .tarjeta {
  height: auto;
}

.score-curva {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--gap-densidad, var(--espacio-4));
  align-items: stretch;
}

.score-curva > .tarjeta {
  height: 100%;
  min-width: 0;
}

.score-curva__curva h2 {
  margin: 0;
  color: var(--color-primario);
  font-size: var(--tipo-base);
}

.score-curva__curva .tabla {
  margin: 0;
}

.score-curva__curva .fila-aplica td {
  background: var(--color-primario-100);
  color: var(--color-primario-900);
  font-weight: var(--peso-bold);
  box-shadow: none;
}

.score-curva__curva .fila-aplica td:first-child {
  box-shadow: inset 3px 0 0 var(--color-primario);
}

.score-curva__curva .fila-aplica.fila-peligro td {
  background: var(--color-peligro-100);
  color: var(--alerta);
}

.score-curva__curva .fila-aplica.fila-peligro td:first-child {
  box-shadow: inset 3px 0 0 var(--alerta);
}

.score-curva .score-ficha__valor {
  color: var(--color-primario);
  font-size: 56px;
}

.score-curva .score-ficha__linea .faltan {
  color: var(--alerta);
}

/* Barra 0–120: bajo 80 gris/rojo suave, de 80 a 120 azul */
.score-barra .medidor__pista {
  height: 16px;
  background: linear-gradient(
    to right,
    var(--color-peligro-100) 0 var(--corte, 66.6667%),
    var(--color-primario-100) var(--corte, 66.6667%) 100%
  );
}

.score-barra .medidor__relleno {
  display: none;
}

.score-barra .medidor__marca {
  top: 0;
  bottom: 0;
  background: var(--color-primario-500);
  opacity: 0.55;
}

.score-barra .medidor__marca--fin {
  transform: translateX(-100%);
}

.score-barra .medidor__actual {
  top: -22px;
  color: var(--color-primario);
  font-size: 16px;
}

.score-barra .medidor__etiqueta {
  color: var(--gris-4);
}

@media (max-width: 900px) {
  .score-curva {
    grid-template-columns: minmax(0, 1fr);
  }
}

/* Cargar: cajas del mismo tamaño en grilla */
.cargar-archivos {
  grid-auto-rows: 1fr;
}

.cargar-archivos > * {
  height: 100%;
  min-width: 0;
}

/* Encabezado: el título se ve completo a 900 px (envuelve y baja de tamaño) */
@media (max-width: 900px) {
  .app {
    grid-template-rows: auto minmax(0, 1fr);
  }

  .barra-app {
    height: auto;
    min-height: 48px;
    max-height: none;
    flex-wrap: wrap;
    overflow: visible;
    padding: var(--espacio-2) var(--espacio-4);
    row-gap: var(--espacio-1);
  }

  .barra-app__titulos {
    flex: 1 1 220px;
  }

  .barra-app h1 {
    font-size: var(--tipo-sm);
    line-height: 1.2;
    white-space: normal;
    overflow: visible;
    text-overflow: clip;
  }

  .titulo-pagina {
    overflow-wrap: anywhere;
    font-size: var(--tipo-xl);
  }
}

@media print {
  .ver-formula > summary {
    display: none;
  }
}

/* v21: opciones avanzadas (BTL_Eventos) y ayudas de las cajas de carga */
.opciones-avanzadas { margin-top: var(--espacio-4); border: 1px solid var(--gris-3); border-radius: var(--radio); padding: var(--espacio-3) var(--espacio-4); background: var(--gris-1); }
.opciones-avanzadas > summary { cursor: pointer; font-weight: 600; color: var(--color-primario); }
.opciones-avanzadas[open] > summary { margin-bottom: var(--espacio-3); }
.zona-ayuda { margin: 0 0 var(--espacio-2); color: var(--gris-5); font-size: 0.9rem; line-height: 1.35; }
.ver-detalle { font-size: 0.85rem; color: var(--gris-5); }
.ver-detalle > summary { cursor: pointer; list-style: none; }

/* ===== v22 · Ajustes de orden y espacio (las tarjetas no se encogen, nada se corta) ===== */
.encabezado-pagos > * { flex-shrink: 0; }
.encabezado-pagos { gap: var(--espacio-3); }
.encabezado-pagos__tarjetas { align-items: stretch; }
.tarjeta-pago { height: auto; overflow: visible; }
.tarjeta-pago .acciones-btl { margin-top: auto; padding-top: var(--espacio-3); display: flex; flex-wrap: wrap; gap: var(--espacio-2); align-items: center; }

/* KPIs del equipo: altura según el contenido */
.equipo-kpis .kpi { height: auto; min-height: 96px; overflow: visible; display: flex; flex-direction: column; gap: 4px; padding: var(--espacio-3) var(--espacio-4); }
.equipo-kpis .kpi__valor { margin: 2px 0; }
.equipo-kpis .kpi__etiqueta + .kpi__valor + .kpi__etiqueta { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--color-neutro-500); }
.kpis { gap: var(--espacio-3); margin-bottom: var(--espacio-4); }

/* Equipo: gráfico arriba a lo ancho y la tabla completa debajo */
.equipo-cuerpo { grid-template-columns: minmax(0, 1fr); gap: var(--espacio-4); }
.equipo-cuerpo > .tarjeta { height: auto; }
.grafico-fila__barras { gap: 4px; }
.grafico-barra { height: 9px; }
.tabla-ranking { table-layout: auto; font-size: var(--tipo-sm); }
.tabla-ranking th, .tabla-ranking td { padding: 8px 10px; overflow: visible; text-overflow: clip; white-space: nowrap; }
.tabla-ranking th { white-space: normal; vertical-align: bottom; line-height: 1.2; }

/* Encabezado de la app: aire a los lados */
.barra-app, header.app-barra, .app-encabezado { padding-left: var(--espacio-4); padding-right: var(--espacio-4); }

/* Secciones y tarjetas: separación pareja */
.ficha-pantalla > * + *, .panel > * + * { margin-top: var(--espacio-4); }
.seccion__resumen { white-space: normal; overflow: visible; }


/* ===== v23 · Rentabilidad de Educación y asistencia técnica (5.4) ===== */
.rentabilidad-edu {
  margin-top: var(--espacio-4);
  padding: var(--espacio-3) var(--espacio-4);
  border: 1px solid var(--color-primario-100);
  border-left: 4px solid var(--color-primario-500);
  border-radius: var(--radio-md);
  background: var(--color-primario-50);
}
.rentabilidad-edu__titulo { margin: 0 0 var(--espacio-2); font-size: var(--tipo-base); color: var(--color-primario-900); }
.rentabilidad-edu__cuerpo { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: var(--espacio-4); align-items: start; }
.rentabilidad-edu__tabla { width: 100%; background: var(--color-neutro-0); }
.rentabilidad-edu__tabla th { text-align: left; font-weight: 400; color: var(--color-neutro-700); }
.rentabilidad-edu__tabla td { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.rentabilidad-edu__subtitulo { margin: 0 0 var(--espacio-2); font-size: var(--tipo-sm); font-weight: 600; color: var(--color-neutro-700); }
.bandas-margen { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.banda-margen { display: flex; justify-content: space-between; gap: var(--espacio-3); padding: 6px 10px; border: 1px solid var(--color-neutro-200); border-radius: var(--radio-md); background: var(--color-neutro-0); font-size: var(--tipo-sm); }
.banda-margen--aplica { border-color: var(--color-exito-700); background: var(--color-exito-100); box-shadow: inset 3px 0 0 var(--color-exito-700); font-weight: 600; }
.rentabilidad-edu__nota { margin: var(--espacio-3) 0 0; font-size: var(--tipo-sm); color: var(--color-neutro-700); line-height: 1.45; }
.rentabilidad-edu .detalle-equipo { margin-top: var(--espacio-3); }
.nota-mision { margin-top: var(--espacio-2); font-size: var(--tipo-sm); color: var(--color-neutro-700); }
@media (max-width: 900px) {
  .rentabilidad-edu__cuerpo { grid-template-columns: minmax(0, 1fr); }
}

/* ===== v23 · Impresión de fichas (carta vertical). Va al final para ganar a las reglas anteriores. ===== */
@media print {
  /* Las cajas con scroll (main, body) partían el contenido en una sola página: en papel todo fluye. */
  html, body, .app, main, #contenido, #panel-detalle, .panel {
    overflow: visible !important;
    height: auto !important;
    max-height: none !important;
    min-height: 0 !important;
  }
  .app, main, #contenido { display: block !important; }
  main, #contenido, :focus, :focus-visible { outline: none !important; }
  html, body { background: #fff !important; }
  body { font-size: 9.5pt; line-height: 1.3; color: var(--color-neutro-900); }
  .marca-cada-pagina { display: none !important; }

  /* Cada ficha empieza en página nueva solo cuando se imprimen todas; nunca deja una hoja en blanco al final. */
  .ficha, .ficha:last-of-type { break-after: auto !important; margin: 0 !important; padding: 0 !important; }
  body.imprimir-todas .ficha ~ .ficha { break-before: page; }
  body:not(.imprimir-todas) .ficha-reposo { display: none !important; }

  .ficha-impresion { display: block !important; width: 100%; font-size: 9.5pt; }
  .ficha-impresion * { box-shadow: none !important; }
  .ficha-impresion p { margin: 0; }
  .ficha-impresion button,
  .ficha-impresion .no-imprimir,

/* Simulador ANALFE — layout tipo Figma: tabs superiores, KPI compacto, tarjetas densas */

  min-width: 0;
}

.kpi-bloque--acento {
  border-color: rgba(31, 78, 140, 0.28);
  background: linear-gradient(180deg, #fff, var(--color-primario-50));
}

.kpi-etiqueta {
  margin: 0;
  font-size: 10px;
  color: var(--color-neutro-500);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-weight: var(--peso-medio);
}

.kpi-valor {
  margin: 2px 0 0;
  font-size: clamp(15px, 1.4vw, 20px);
  font-weight: 700;
  color: var(--color-primario-900);
  line-height: 1.15;
  word-break: break-word;
}

.kpi-valor--sm {
  font-size: var(--tipo-lg);
}

.kpi-hint {
  flex: 1 1 160px;
  padding: 8px 10px;
  border-radius: 10px;
  background: var(--color-primario-100);
  color: var(--color-neutro-700);
  font-size: var(--tipo-sm);
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 2px;
  min-width: 0;
}

.kpi-hint .kpi-etiqueta {
  color: var(--color-primario-700);
}

.kpi-hint p {
  margin: 0;
}

.kpi-mini {
  margin: 0;
  font-size: var(--tipo-xs);
  color: var(--color-neutro-500);
}

/* Orden de indicadores: Ventas → Base → Diversificación → Satisfacción */
.simular-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-areas:
    "ventas ventas"
    "base base"
    "div-titulo div-titulo"
    "ser innov"
    "satisf satisf"
    "btl btl";
  gap: 10px;
  align-items: stretch;
}

.celda-ventas { grid-area: ventas; }
.celda-base { grid-area: base; }
.celda-div-titulo { grid-area: div-titulo; }
.celda-ser { grid-area: ser; }
.celda-innov { grid-area: innov; }
.celda-satisf { grid-area: satisf; }
.celda-btl { grid-area: btl; }

.simular-seccion {
  margin: 2px 0 0;
  padding: 0 2px;
  font-size: 12px;
  font-weight: 650;
  letter-spacing: 0.02em;
  color: var(--color-primario-700);
}

.app--simulador .tarjeta.tarjeta--sim {
  height: auto;
  min-height: 0;
  gap: 8px;
  padding: 12px 14px;
  border-radius: 12px;
  box-shadow: 0 1px 2px rgba(11, 37, 69, 0.04), 0 6px 18px rgba(11, 37, 69, 0.035);
  display: flex;
  flex-direction: column;
}

.app--simulador .tarjeta.tarjeta--sim > .campos-rejilla,
.app--simulador .tarjeta.tarjeta--sim > .campo,
.app--simulador .tarjeta.tarjeta--sim > .traza,
.app--simulador .tarjeta.tarjeta--sim > .ver-formula {
  flex: 0 0 auto;
}

.tarjeta__cab {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin: 0;
  padding-bottom: 0;
  min-height: 28px;
}

.tarjeta__cab-izq {
  display: flex;
  align-items: baseline;
  gap: 8px;
  min-width: 0;
  flex-wrap: wrap;
}

.tarjeta__cab h3 {
  margin: 0;
  font-size: 14px;
  font-weight: 650;
  color: var(--color-primario-900);
}

.tarjeta__sub {
  font-size: 11px;
  color: var(--color-neutro-500);
  font-weight: var(--peso-medio);
}

/* Badge de puntos por indicador */
.pts-badge {
  display: inline-flex;
  align-items: baseline;
  gap: 3px;
  flex: 0 0 auto;
  padding: 4px 9px;
  border-radius: 999px;
  background: var(--color-primario-100);
  color: var(--color-primario-900);
  font-size: 13px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  line-height: 1.2;
  white-space: nowrap;
}

.pts-badge__u {
  font-size: 10px;
  font-weight: 600;
  color: var(--color-primario-700);
  text-transform: lowercase;
}

.pts-badge__tope {
  font-size: 10px;
  font-weight: 500;
  color: var(--color-neutro-500);
}

/* Trazabilidad: puntos por ítem */
.traza {
  list-style: none;
  margin: 0;
  padding: 5px 8px;
  border-radius: 8px;
  background: var(--color-neutro-100);
  border: 1px solid var(--color-neutro-200);
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.app--simulador .ver-formula {
  margin: 0;
}

.app--simulador .ver-formula > summary {
  font-size: 11px;
  padding: 2px 0;
}

.traza__item {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  font-size: 11px;
  line-height: 1.35;
  color: var(--color-neutro-600);
}

.traza__lab {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.traza__val {
  flex: 0 0 auto;
  font-weight: 650;
  font-variant-numeric: tabular-nums;
  color: var(--color-primario-800);
}

.traza__item--total {
  margin-top: 2px;
  padding-top: 4px;
  border-top: 1px dashed var(--color-neutro-200);
  color: var(--color-primario-900);
  font-weight: 600;
}

.traza__item--total .traza__val {
  font-size: 12px;
}

/* —— Sistema de campos (independiente del liquidador) —— */
.campos-lista {
  display: flex;
  flex-direction: column;
  gap: 14px;
  width: 100%;
}

.campos-rejilla {
  display: grid;
  gap: 8px 12px;
  width: 100%;
  align-items: start;
}

.campos-rejilla--2 {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.campos-rejilla--3 {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.app--simulador .campo {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 4px;
  margin: 0;
  width: 100%;
  min-width: 0;
}

.app--simulador .campo__cabeza {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  min-width: 0;
}

.app--simulador .campo__etiqueta {
  display: block;
  font-size: 12px;
  line-height: 1.3;
  font-weight: 600;
  color: var(--color-neutro-700);
  text-align: left;
}

.app--simulador .campo__unidad {
  color: var(--color-neutro-500);
  font-weight: 500;
}

.app--simulador .campo__meta,
.app--simulador .campo__pista {
  flex: 0 1 auto;
  min-height: 15px;
  font-size: 11px;
  font-weight: 600;
  text-align: right;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.app--simulador .campo__meta {
  color: var(--color-primario-500);
}

.app--simulador .campo__pista {
  color: var(--color-neutro-500);
  font-weight: 500;
}

.app--simulador .campo__input {
  display: block;
  box-sizing: border-box;
  width: 100%;
  max-width: none;
  min-height: 36px;
  margin: 0;
  padding: 7px 10px;
  border: 1px solid #e2d7a8;
  border-radius: 7px;
  background: #fffef6;
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--color-primario-900);
  outline: none;
  transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
}

.app--simulador .campo__input:hover {
  border-color: #c9b86a;
}

.app--simulador .campo__input:focus {
  border-color: var(--color-primario-500);
  background: #fff;
  box-shadow: 0 0 0 3px var(--color-primario-100);

.app--simulador .campo__input--select {
  cursor: pointer;
}

.app--simulador .campo-editable {

  min-height: 40px;
  border-radius: 10px;
  width: 100%;
  max-width: none;
  box-sizing: border-box;
}

.tarjeta--plegable {
  grid-column: 1 / -1;
}

  cursor: pointer;
  list-style: none;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin: 0;
}

.tarjeta--plegable > summary::-webkit-details-marker {
  display: none;
}

.tarjeta--plegable[open] > summary {

  padding-bottom: 12px;
  border-bottom: 1px solid var(--color-neutro-200);
}

  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
  align-items: start;
}

.app--simulador .analisis-grid .tarjeta {
  height: auto;
}

.kpis--compactos {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  margin-bottom: 14px;
}

.perfil-resumen {
  margin-top: 12px;
  padding: 12px 14px;
  border-radius: 12px;
  background: var(--color-primario-50);
}

.fila-acciones {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 14px;
}

.boton--primario {
  background: var(--color-primario-500);
  color: var(--color-neutro-0);
  border: none;
}

.svg-curva,
.svg-sens {
  width: 100%;
  max-width: 560px;
  height: auto;
  margin-top: 12px;
}

.marca-cada-pagina {
  display: none;
}

.app--simulador .titulo-pagina {
  margin: 0 0 8px;
  font-size: 22px;
  color: var(--color-primario-900);
}

.app--simulador .zona-ayuda {
  margin-top: 0;
  margin-bottom: 14px;
}

.app--simulador .zona-ayuda--compacta {
  margin: 0 0 4px;
  font-size: var(--tipo-xs);
  color: var(--color-neutro-500);
}

@media (max-width: 980px) {
  .analisis-grid {
    grid-template-columns: 1fr;
  }

  .app--simulador .franja-kpi:nth-child(n + 3) {
    display: none;
  }
}

/* Una columna solo en móvil estrecho */
@media (max-width: 720px) {
  .simular-grid {
    grid-template-columns: 1fr;
    grid-template-areas:
      "ventas"
      "base"
      "div-titulo"
      "ser"
      "innov"
      "satisf"
      "btl";
  }
}

/* Campos en 2 columnas hasta móvil estrecho */
@media (max-width: 640px) {
  .campos-rejilla--2,
  .campos-rejilla--3 {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 720px) {
  .app--simulador {
    grid-template-rows: auto 48px minmax(0, 1fr);
  }

  .app--simulador > .barra-app {
    height: auto;
    min-height: 56px;
    flex-wrap: wrap;
    padding-top: 10px;
    padding-bottom: 10px;
  }

  .tabs-vista {
    top: 0;
    overflow-x: auto;
  }

  .kpis--compactos {
    grid-template-columns: 1fr;
  }

  .chip-simulacion {
    display: none;
  }

}

@media print {
  .tabs-vista,
  .barra-app .chip-simulacion,
  .fila-acciones,
  .zona-archivo {

    display: block;
    position: fixed;
    bottom: 8px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 10pt;
  }

  .app--simulador {
    display: block !important;
  }

  .panel {
    display: block !important;
    break-inside: avoid;
  }
}

        if (el.tagName === "INPUT" && (el.inputMode === "decimal" || el.classList.contains("campo__input"))) {
          valor = numeroFlexible(valor);
        } else if (el.tagName === "SELECT" && ruta.startsWith("factor")) {
          valor = valor === "" ? null : numeroFlexible(valor);
        }
        if (ruta.includes(".")) {
          const [a, b] = ruta.split(".");
          parchearEntradas({ [a]: { [b]: valor } });
        } else if (ruta === "satisfaccion" || ruta === "comisionAnterior" || ruta.startsWith("educacion") || ruta.startsWith("mision") || ruta.startsWith("congreso") || ruta.startsWith("cultural") || ruta.startsWith("factor")) {
          parchearEntradas({ [ruta]: valor });
        } else {
          establecerCampo(ruta, valor);
        }
      };
      el.addEventListener("change", aplicar);
      el.addEventListener("blur", aplicar);
    });
  }

    paso.addEventListener("click", (ev) => {
      ev.preventDefault();
      mostrarPanel(paso.dataset.panel);
    });
  });
  suscribir(() => {
    if (pintarCompleto) return;
    pintarFranjaPublica(obtenerEstado());
    if (panelActivo === "simular" || panelActivo === "analisis") {
      pintarCompleto = true;
      pintarTodo();
      pintarCompleto = false;
      document.querySelectorAll(".panel").forEach((panel) => {
        const visible = panel.id === `panel-${panelActivo}`;
        panel.hidden = !visible;
        panel.classList.toggle("activo", visible);
      });
    }
  });
  function pedirRepintado() {
    pintarCompleto = true;
    pintarTodo();
    pintarCompleto = false;
    document.querySelectorAll(".panel").forEach((panel) => {
      const visible = panel.id === `panel-${panelActivo}`;
      panel.hidden = !visible;
      panel.classList.toggle("activo", visible);
    });
  }
  window.ANALFE_PEDIR_REPINTADO = pedirRepintado;
  window.ANALFE_SIM = { obtenerEstado, mostrarPanel };
  async function arrancar() {
    const hash = (location.hash || "#simular").slice(1);
    const legacy = {
      perfil: "archivo",
      ventas: "simular",
      base: "simular",
      diversificacion: "simular",
      satisfaccion: "simular",
      btl: "simular",
      resultado: "analisis",
      sensibilidad: "analisis",
      guardar: "archivo"
    };
    const vista = VISTAS.includes(hash) ? hash : legacy[hash] || "simular";
    pintarCompleto = true;
    const recordado = leerPerfilRecordado();
    if (recordado?.ok) {
      establecerPerfil(recordado.perfil, "archivo");
    } else {
      const res = await cargarPerfilEjemplo("comercial");
      if (res.ok) establecerPerfil(res.perfil, "ejemplo");
    }
    mostrarPanel(vista);
  }
  arrancar().catch((e) => {
    console.error(e);
    document.body?.insertAdjacentHTML(
      "afterbegin",
      `<p class="aviso-caja">No se pudo iniciar el simulador. ${String(e.message || e)}</p>`
    );
  });
})();

</script>
